<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f6fb;--cd:#fff;--tx:#14213d;--mu:#6b7686;--bd:#e1e6ef;--pr:#1769e0;--am:#f59e0b;--ok:#16a34a;--bad:#dc2626;--nav:#0b2a5b}
@media(prefers-color-scheme:dark){:root{--bg:#0d1422;--cd:#162036;--tx:#e8edf5;--mu:#93a1b6;--bd:#26324a;--nav:#08162f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
.btn{background:var(--pr);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer}.btn.a{background:var(--am);color:#111}
.btn.s{background:var(--cd);border:1px solid var(--bd);color:var(--tx);padding:6px 10px;font-weight:500}.btn.d{color:var(--bad)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px}.mu{color:var(--mu);font-size:13px}
.gl{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:50% 6%;background:#fff;flex:none}
.wb{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.wb span{color:var(--am)}
.wn{display:flex;justify-content:space-between;align-items:center;padding:12px 5vw;background:var(--cd);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;padding:50px 5vw;background:linear-gradient(135deg,#0b2a5b,#1769e0);color:#fff}
.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 12px}.hero img{width:100%;max-width:240px;margin:auto;display:block;border-radius:16px;background:#fff;padding:10px}
.sec{padding:36px 5vw}.sec h2{text-align:center}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pc{text-align:center}.pc b.p{font-size:28px;color:var(--pr)}.pc ul{list-style:none;padding:0;text-align:left;font-size:14px}.pc li:before{content:"✓ ";color:var(--ok)}
#auth{max-width:400px;margin:6vh auto;padding:24px}#auth p{margin:10px 0}
#app{display:none}aside{position:fixed;left:0;top:0;bottom:0;width:210px;background:var(--nav);color:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:4px}
aside .wb{font-size:17px;padding:0 6px 14px}nav a{display:block;padding:10px 12px;border-radius:8px;color:#cbd5e5;cursor:pointer}nav a.on,nav a:hover{background:rgba(245,158,11,.2);color:#fff}
.hd{margin-left:210px;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--cd);border-bottom:1px solid var(--bd);gap:10px}
main{margin-left:210px;padding:20px 20px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}h2,h3{margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.stat b{display:block;font-size:22px;margin-top:4px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:rgba(245,158,11,.2)}.tag.g{background:rgba(22,163,74,.2);color:var(--ok)}.tag.r{background:rgba(220,38,38,.2);color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:9}#mod>div{width:100%;max-width:600px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{font-size:12px;color:var(--mu);display:block}.fg .w{grid-column:1/-1}
.stp{display:grid;grid-template-columns:auto 1fr 130px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}.stp input[type=checkbox]{width:20px;height:20px}.stp .n{grid-column:2/4}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99}
.ban{background:rgba(245,158,11,.18);border:1px solid var(--am);padding:10px 14px;border-radius:10px;margin-bottom:14px}
@media(max-width:780px){.hero{grid-template-columns:1fr;text-align:center}aside{top:auto;width:100%;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}aside .wb,.out{display:none}nav{display:flex;width:100%;overflow-x:auto}nav a{flex:none;text-align:center;font-size:12px;padding:8px 11px}.hd,main{margin-left:0}main{padding:14px 14px 90px}.fg,.stp{grid-template-columns:1fr}.stp .n{grid-column:auto}}
#pr{display:none}@media print{body>*:not(#pr){display:none!important}#pr{display:block;background:#fff;color:#000;padding:20px}#pr td,#pr th{border:1px solid #999;padding:6px;text-align:left}}</style></head><body>

<script type="text/plain" id="sql">create table if not exists ss_plans(id uuid primary key default gen_random_uuid(),name text,price numeric,days int,max_customers int default 0,features text);
create table if not exists ss_profiles(id uuid primary key references auth.users on delete cascade,email text,role text default 'user',active boolean default true,business jsonb default '{}',plan_id uuid,plan_name text,plan_expiry date,plan_request uuid,created_at timestamptz default now());
create table if not exists ss_records(id uuid primary key default gen_random_uuid(),user_id uuid default auth.uid(),kind text not null,data jsonb not null,created_at timestamptz default now());
create or replace function is_owner() returns boolean language sql security definer set search_path=public stable as $$select exists(select 1 from ss_profiles where id=auth.uid() and role='owner')$$;
create or replace function ss_new_user() returns trigger language plpgsql security definer set search_path=public as $$begin insert into ss_profiles(id,email,role,business) values(new.id,new.email,case when exists(select 1 from ss_profiles) then 'user' else 'owner' end,jsonb_build_object('name',new.raw_user_meta_data->>'biz'));return new;end$$;
drop trigger if exists ss_nu on auth.users;
create trigger ss_nu after insert on auth.users for each row execute function ss_new_user();
create or replace function ss_guard() returns trigger language plpgsql security definer set search_path=public as $$begin if not is_owner() then new.role=old.role;new.active=old.active;new.plan_id=old.plan_id;new.plan_name=old.plan_name;new.plan_expiry=old.plan_expiry;end if;return new;end$$;
drop trigger if exists ss_g on ss_profiles;
create trigger ss_g before update on ss_profiles for each row execute function ss_guard();
alter table ss_plans enable row level security;alter table ss_profiles enable row level security;alter table ss_records enable row level security;
create policy pl_r on ss_plans for select using(true);
create policy pl_w on ss_plans for all using(is_owner()) with check(is_owner());
create policy pr_r on ss_profiles for select using(auth.uid()=id or is_owner());
create policy pr_u on ss_profiles for update using(auth.uid()=id or is_owner());
create policy rc_a on ss_records for all using(auth.uid()=user_id or is_owner()) with check(auth.uid()=user_id);
alter table ss_profiles add column if not exists parent uuid;
create or replace function my_parent() returns uuid language sql security definer stable set search_path=public as $$select parent from ss_profiles where id=auth.uid()$$;
create or replace function ss_guard() returns trigger language plpgsql security definer set search_path=public as $$begin if not is_owner() then new.role=old.role;new.active=old.active;new.plan_id=old.plan_id;new.plan_name=old.plan_name;new.plan_expiry=old.plan_expiry;if coalesce(current_setting('ss.staff',true),'')<>'1' then new.parent=old.parent;end if;end if;return new;end$$;
create or replace function ss_add_staff(em text) returns void language plpgsql security definer set search_path=public as $$begin perform set_config('ss.staff','1',true);update ss_profiles set parent=auth.uid() where lower(email)=lower(em) and parent is null and role='user' and created_at>now()-interval '10 minutes' and id<>auth.uid();end$$;
create or replace function ss_track(tid uuid) returns jsonb language sql security definer stable set search_path=public as $$select jsonb_build_object('c',r.data-'pay'-'cost'-'docs'-'phone'-'addr','b',p.business-'gst') from ss_records r join ss_profiles p on p.id=r.user_id where r.id=tid and r.kind='customer'$$;
grant execute on function ss_track(uuid) to anon, authenticated;
grant execute on function ss_add_staff(text) to authenticated;
grant execute on function my_parent() to authenticated;
drop policy if exists rc_a on ss_records;
create policy rc_a on ss_records for all using(auth.uid()=user_id or user_id=my_parent() or is_owner()) with check(auth.uid()=user_id or user_id=my_parent());
drop policy if exists pr_r on ss_profiles;
create policy pr_r on ss_profiles for select using(auth.uid()=id or parent=auth.uid() or id=my_parent() or is_owner());
insert into storage.buckets(id,name,public) values('ss-docs','ss-docs',false) on conflict do nothing;
drop policy if exists docs_all on storage.objects;
create policy docs_all on storage.objects for all to authenticated using(bucket_id='ss-docs' and (storage.foldername(name))[1] in (auth.uid()::text,my_parent()::text)) with check(bucket_id='ss-docs' and (storage.foldername(name))[1] in (auth.uid()::text,my_parent()::text));
</script>

let D={};const L=k=>D[k]||[],LS=['New','Contacted','Site Survey','Proposal Sent','Negotiation','Won','Lost'];
const MD={
lead:{t:'Lead',c:['name','phone','city','kw','stage','follow'],f:[['name','Name'],['phone','Phone','tel'],['city','City / Address'],['type','Project type','select',Object.keys(TY)],['bill','Monthly bill ₹ (auto kW)','number'],['roof','Roof type','select',['RCC','Metal sheet','Tin shed','Ground']],['area','Roof area (sq ft)','number'],['kw','Suggested kW','number'],['stage','Stage','select',LS],['follow','Next follow-up','date'],['src','Source','select',['Walk-in','Referral','Online','Cold call','Ads']],['notes','Survey / notes','textarea']]},
quote:{t:'Proposal',c:['no','cust','kw','amt','status'],f:[['cust','Customer'],['phone','Phone','tel'],['type','Project type','select',Object.keys(TY)],['kw','System size kW','number'],['rate','Rate ₹ per kW','number'],['gst','GST %','number'],['sub','Govt subsidy (residential)','select',['Yes','No']],['status','Status','select',['Draft','Sent','Accepted','Rejected']],['date','Date','date']]},
stock:{t:'Item',c:['item','category','supplier','qty','cost','status'],f:[['item','Item'],['category','Category','select',['Panel','Inverter','Battery','Structure','Cable','Meter','Other']],['supplier','Supplier'],['qty','Quantity','number'],['cost','Unit cost ₹','number'],['status','Status','select',['Required','Ordered','Received']]]},
ticket:{t:'Ticket',c:['cust','issue','type','due','status'],f:[['cust','Customer'],['issue','Issue / work'],['type','Type','select',['Complaint','AMC visit','Cleaning','Inspection']],['due','Due date','date'],['status','Status','select',['Open','In progress','Resolved']]]},
expense:{t:'Expense',c:['date','title','category','amount'],f:[['title','Title'],['amount','Amount ₹','number'],['date','Date','date'],['category','Category','select',['Material','Labour','Transport','Office','Marketing','Salary','Other']]]},
member:{t:'Member',c:['name','phone','role'],f:[['name','Name'],['phone','Phone','tel'],['role','Role','select',['Sales','Surveyor','Installer','Engineer','Accounts']]]},
task:{t:'Task',c:['title','who','due','status'],f:[['title','Task'],['who','Assigned to'],['due','Due date','date'],['status','Status','select',['Pending','In progress','Done']]]}};
const DF={lead:{stage:'New',type:'On-grid Rooftop',src:'Walk-in',roof:'RCC'},quote:{rate:60000,gst:8.9,status:'Draft',sub:'Yes',type:'On-grid Rooftop',date:today()},stock:{status:'Required',category:'Panel'},ticket:{type:'AMC visit',status:'Open'},expense:{date:today(),category:'Material'},member:{role:'Sales'},task:{status:'Pending'}};
const subs=q=>q.sub=='Yes'&&['On-grid Rooftop','Hybrid'].includes(q.type)?(q.kw<=2?q.kw*30000:q.kw<3?60000+(q.kw-2)*18000:78000):0,
qt=q=>{const b=q.kw*q.rate,g=b*q.gst/100,s=subs(q);return{b,g,s,net:b+g-s}};
const fm=(x,c)=>c=='amt'?inr(qt(x).net):['cost','amount'].includes(c)?inr(x[c]):['stage','status'].includes(c)?`<span class="tag ${['Won','Accepted','Done','Resolved','Received'].includes(x[c])?'g':['Lost','Rejected'].includes(x[c])?'r':''}">${esc(x[c])}</span>`:esc(x[c]);
const act=(k,x)=>k=='lead'?`<button class="btn s" onclick="toQ('${x.id}')">Quote</button> <button class="btn s" onclick="toP('${x.id}','lead')">→ Project</button> `:k=='quote'?`<button class="btn s" onclick="pq('${x.id}')">Print</button> <button class="btn s" onclick="wq('${x.id}')">WhatsApp</button> <button class="btn s" onclick="toP('${x.id}','quote')">→ Project</button> `:'';
const mt=k=>{const m=MD[k];return `<table><tr>${m.c.map(c=>`<th>${c=='amt'?'net payable':c}</th>`).join('')}<th></th></tr>${L(k).map(x=>`<tr>${m.c.map(c=>`<td>${fm(x,c)}</td>`).join('')}<td>${act(k,x)}<button class="btn s" onclick="mf('${k}','${x.id}')">Edit</button> <button class="btn s d" onclick="md('${x.id}')">✕</button></td></tr>`).join('')||'<tr><td class="mu">No records yet</td></tr>'}</table>`};
const mv=(k,h,ex='')=>`${lock()}<div class="top"><h2>${h}</h2><button class="btn" onclick="mf('${k}')">+ Add ${MD[k].t}</button></div>${ex}<div class="card tw" style="margin-bottom:16px">${mt(k)}</div>`;
function mf(k,id,pre){if(!okPlan())return toast('Choose a plan first');const m=MD[k],o=id?L(k).find(x=>x.id==id):{...DF[k],...pre};
M(`<h3>${id?'Edit':'Add'} ${m.t}</h3><div class="fg">${m.f.map(([n,l,t,op])=>`<div class="${t=='textarea'?'w':''}"><label>${l}</label>${t=='select'?`<select id="m_${n}">${op.map(x=>`<option ${o[n]==x?'selected':''}>${x}</option>`).join('')}</select>`:t=='textarea'?`<textarea id="m_${n}" rows="2">${esc(o[n])}</textarea>`:`<input id="m_${n}" type="${t||'text'}" value="${esc(o[n])}" ${k=='lead'&&n=='bill'?`oninput="$('m_kw').value=Math.max(1,Math.round(this.value/960*2)/2)"`:''}>`}</div>`).join('')}</div><p><button class="btn" onclick="ms('${k}','${id||''}')">Save</button> <button class="btn s" onclick="closeM()">Cancel</button></p>`)}
async function ms(k,id){const m=MD[k],o=id?{...L(k).find(x=>x.id==id)}:{...DF[k]};m.f.forEach(([n,,t])=>{const e=$('m_'+n);o[n]=t=='number'?+e.value||0:e.value});if(!o[m.f[0][0]])return toast('Required: '+m.f[0][1]);
if(k=='quote'&&!o.no)o.no='Q-'+String(L('quote').length+1).padStart(3,'0');if(await put('ss_records',o,id||null,k)){closeM();go(v);toast('Saved')}}
async function md(id){if(!confirm('Delete this record?'))return;await sb.from('ss_records').delete().eq('id',id);go(v)}
function toQ(id){const l=L('lead').find(x=>x.id==id);mf('quote',null,{cust:l.name,phone:l.phone,type:l.type,kw:l.kw})}
async function toP(id,k){if(!okPlan())return toast('Choose a plan first');const s=L(k).find(x=>x.id==id);
if(!await put('ss_records',{name:s.name||s.cust,phone:s.phone,addr:s.city||'',type:s.type,kw:s.kw,cost:k=='quote'?Math.round(qt(s).net):0,done:{0:{date:today(),note:'Converted from '+k}},pay:[]},null,'customer'))return;
await put('ss_records',k=='lead'?{...s,stage:'Won'}:{...s,status:'Accepted'},id,k);toast('Project created');go('cust')}
function pq(id){const q=L('quote').find(x=>x.id==id),c=qt(q),b=P.business;
$('pr').innerHTML=`<div style="display:flex;gap:12px;align-items:center">${b.logo?`<img src="${b.logo}" height="60">`:''}<div><h1 style="margin:0">${esc(b.name)}</h1>${esc(b.addr)} ${esc(b.city)} · ${esc(b.phone)} ${b.gst?'· GST '+esc(b.gst):''}</div></div><hr><h2>Solar Proposal ${esc(q.no)}</h2><p>Date: ${q.date}<br>To: <b>${esc(q.cust)}</b> ${esc(q.phone)}</p>
<table style="width:100%;border-collapse:collapse"><tr><th>Scope</th><th>Details</th></tr><tr><td>System</td><td>${q.kw} kW ${esc(q.type)}</td></tr><tr><td>Solar modules</td><td>${Math.ceil(q.kw*1000/545)} × 545 Wp</td></tr><tr><td>Inverter</td><td>${q.kw} kW</td></tr><tr><td>Includes</td><td>Structure, cables, protection, net-meter support, installation &amp; commissioning</td></tr></table>
<p>System cost: ${inr(c.b)}<br>GST (${q.gst}%): ${inr(c.g)}<br>Estimated subsidy: −${inr(c.s)}<br><b>Net payable: ${inr(c.net)}</b></p><p style="font-size:12px">Valid 15 days. Subsidy subject to government approval.</p>`;window.print()}
function wq(id){const q=L('quote').find(x=>x.id==id),c=qt(q);window.open('https://wa.me/'+String(q.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(`Hello ${q.cust}, proposal ${q.no} from ${P.business.name||'us'}: ${q.kw} kW solar, net payable ${inr(c.net)} after estimated subsidy ${inr(c.s)}.`),'_blank')}
function dashV(){const t=R.reduce((a,c)=>a+(+c.cost||0),0),p=R.reduce((a,c)=>a+pd(c),0),ex=L('expense').reduce((a,e)=>a+(+e.amount||0),0),fu=L('lead').filter(l=>l.follow&&l.follow<=today()&&!['Won','Lost'].includes(l.stage)),sv=L('ticket').filter(x=>x.status!='Resolved'&&x.due&&x.due<=today()),s=(l,x)=>`<div class="card stat"><span class="mu">${l}</span><b>${x}</b></div>`,li=(a,f)=>a.slice(0,5).map(f).join('')||'<div class="mu">None 🎉</div>';
return `${lock()}<h2>Dashboard</h2><div class="grid">${s('Leads',L('lead').length)}${s('Proposals sent',L('quote').filter(q=>q.status=='Sent').length)}${s('Active projects',R.filter(c=>pr(c)<100).length)}${s('kW (projects)',R.reduce((a,c)=>a+(+c.kw||0),0))}${s('Project value',inr(t))}${s('Received',inr(p))}${s('Pending',inr(t-p))}${s('Expenses',inr(ex))}${s('Net profit',inr(p-ex))}</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))"><div class="card"><b>Lead pipeline</b>${LS.map(x=>`<div class="mu">${x}: <b>${L('lead').filter(l=>l.stage==x).length}</b></div>`).join('')}</div>
<div class="card"><b>Follow-ups due (${fu.length})</b>${li(fu,l=>`<div class="mu">${esc(l.name)} · ${esc(l.phone)} · ${l.follow}</div>`)}</div>
<div class="card"><b>Service due (${sv.length})</b>${li(sv,x=>`<div class="mu">${esc(x.cust)} · ${esc(x.issue)} · ${x.due}</div>`)}</div></div>`}
function booksV(){const t=R.reduce((a,c)=>a+(+c.cost||0),0),p=R.reduce((a,c)=>a+pd(c),0),ex=L('expense').reduce((a,e)=>a+(+e.amount||0),0),s=(l,x)=>`<div class="card stat"><span class="mu">${l}</span><b>${x}</b></div>`,pay=R.flatMap(c=>(c.pay||[]).map(x=>({...x,c:c.name}))).sort((a,b)=>b.date.localeCompare(a.date));
return `<h2>Books</h2><div class="grid">${s('Project value',inr(t))}${s('Received',inr(p))}${s('Receivable',inr(t-p))}${s('Expenses',inr(ex))}${s('Net profit',inr(p-ex))}</div><h3>Payments received</h3><div class="card tw" style="margin-bottom:16px"><table><tr><th>Date</th><th>Customer</th><th>Mode</th><th>Amount</th></tr>${pay.map(x=>`<tr><td>${x.date}</td><td>${esc(x.c)}</td><td>${esc(x.mode)}</td><td>${inr(x.amt)}</td></tr>`).join('')||'<tr><td class="mu">No payments yet</td></tr>'}</table></div>${mv('expense','Expenses')}`}
Object.assign(VW,{dash:dashV,lead:()=>mv('lead','Leads (CRM)'),quote:()=>mv('quote','Proposals'),stock:()=>mv('stock','Procurement & Stock'),svc:()=>mv('ticket','Service & O&M'),books:booksV,team:()=>mv('member','Team')+mv('task','Tasks')});

/* ---------- v3: staff, docs, tracking, AMC ---------- */
let SF=[];const OID=()=>P.parent||P.id;
const staffV=()=>P.parent?'':`<div class="top"><h2>Staff logins</h2><button class="btn" onclick="sf()">+ Create staff login</button></div><div class="card"><p class="mu">Staff work on your leads, proposals, projects, procurement and service. They cannot see Books, Plan or Profile.</p>${SF.map(s=>`<div>👤 ${esc(s.email)}</div>`).join('')||'<span class="mu">No staff yet</span>'}</div>`;
function sf(){if(!okPlan())return toast('Choose a plan first');M(`<h3>Create staff login</h3><div class="fg"><div class="w"><label>Staff email</label><input id="s_e" type="email"></div><div class="w"><label>Password</label><input id="s_p"></div></div><p><button class="btn" onclick="sc()">Create</button> <button class="btn s" onclick="closeM()">Cancel</button></p>`)}
async function sc(){const e=$('s_e').value.trim(),t=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,storageKey:'tmp2'}});
const {error}=await t.auth.signUp({email:e,password:$('s_p').value,options:{data:{biz:P.business.name}}});if(error)return toast(error.message);
const r=await sb.rpc('ss_add_staff',{em:e});if(r.error)return toast(r.error.message);closeM();go('team');toast('Staff login created. Share email and password.')}
Object.assign(VW,{team:()=>mv('member','Team')+mv('task','Tasks')+staffV()});
async function dup(id,i){const f=i.files[0];if(!f)return;const c=R.find(x=>x.id==id),p=`${OID()}/${id}/${Date.now()}_${f.name.replace(/[^\w.-]/g,'_')}`,r=await sb.storage.from('ss-docs').upload(p,f);if(r.error)return toast(r.error.message);c.docs=[...(c.docs||[]),{name:f.name,path:p}];await put('ss_records',c,id);rl(id)}
async function dopen(id,i){const r=await sb.storage.from('ss-docs').createSignedUrl(R.find(x=>x.id==id).docs[i].path,300);r.error?toast(r.error.message):window.open(r.data.signedUrl,'_blank')}
async function ddel(id,i){const c=R.find(x=>x.id==id);await sb.storage.from('ss-docs').remove([c.docs[i].path]);c.docs.splice(i,1);await put('ss_records',c,id);rl(id)}
function tl(id){const u=location.origin+location.pathname+'?track='+id;navigator.clipboard&&navigator.clipboard.writeText(u);window.open('https://wa.me/'+String(R.find(x=>x.id==id).phone).replace(/\D/g,'')+'?text='+encodeURIComponent('Track your solar project here: '+u),'_blank');toast('Tracking link copied')}
async function track(id){const w=$('welcome');w.style.display='block';const r=await sb.rpc('ss_track',{tid:id});if(r.error||!r.data){w.innerHTML='<div class="sec"><h2>Project not found</h2></div>';return}
const c=r.data.c,b=r.data.b||{},s=TY[c.type]||ON,d=c.done||{},pc=Math.round(Object.keys(d).length/s.length*100);
w.innerHTML=`<div class="wn"><div class="wb">${b.logo?`<img class="gl" src="${b.logo}">`:logo()}<div>${esc(b.name||'Solar Stack')}</div></div><div class="mu">${esc(b.phone)}</div></div><div class="sec" style="max-width:640px;margin:auto"><h2 style="text-align:left">Hello ${esc(c.name)} 👋</h2><p class="mu">${esc(c.type)} · ${esc(c.kw)} kW solar project</p><div class="bar" style="height:14px"><i style="width:${pc}%"></i></div><p><b>${pc}% complete</b></p>${s.map((x,i)=>`<div class="card" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;${d[i]?'':'opacity:.6'}"><span style="font-size:20px">${d[i]?'✅':'⏳'}</span><div><b>${x}</b><div class="mu">${d[i]?esc(d[i].date):'Upcoming'}</div></div></div>`).join('')}<p class="mu" style="text-align:center">Powered by Solar Stack · SRD Sons Technology</p></div>`}

boot();
</script></body></html>
